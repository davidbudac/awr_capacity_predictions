# Capacity-suite documents (log_type awr_capacity, from elk/filebeat/awrcap.yml)
# into the plain index awrcap-capacity.
#
# Lives next to elk_db_automation's oracle.conf in the same Logstash pipeline
# directory; Logstash concatenates every *.conf there in filename order, so the
# Beats input and the common filters of oracle.conf run first. This file must
# sort AFTER oracle.conf (it does: "_" > ".") so the prune below sees, and
# strips, the event.* fields that pipeline adds. The index mapping is strict;
# anything the prune lets through must exist in elk/elasticsearch/index-template.json.
filter {
  if [log_type] == "awr_capacity" {
    # The route and the host name survive the prune under @metadata, which
    # prune never touches and Elasticsearch never stores.
    mutate {
      add_field => { "[@metadata][awrcap_route]" => "awr_capacity" }
      copy      => { "[host][name]" => "[@metadata][awrcap_host]" }
    }
    prune {
      whitelist_names => ["^@timestamp$", "^cap$", "^labels$"]
    }
    if [@metadata][awrcap_host] {
      mutate { add_field => { "[host][name]" => "%{[@metadata][awrcap_host]}" } }
    }
  }
}
output {
  if [@metadata][awrcap_route] == "awr_capacity" {
    elasticsearch {
      hosts                       => ["${ES_HOSTS}"]
      user                        => "${ES_USER}"
      password                    => "${ES_PASSWORD}"
      index                       => "awrcap-capacity"
      document_id                 => "%{[@metadata][_id]}"
      action                      => "index"
      data_stream                 => false
      manage_template             => false
      ssl_enabled                 => "${ES_SSL_ENABLED:true}"
      ssl_certificate_authorities => ["${ES_CA}"]
    }
  }
}
